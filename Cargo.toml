[package]
name = "lemon"
version = "0.2.0-alpha.21"
edition = "2021"
license = "MIT"
repository = "https://github.com/lucasaarch/lemon"
description = "A reactive UI toolkit for Rust"
keywords = ["ui", "gui", "toolkit", "reactive"]
categories = ["gui"]

[dependencies]
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
parley = "0.9"
pollster = "0.4"
taffy = "0.7"
vello = "0.9"
wgpu = "29"
winit = "0.30"
