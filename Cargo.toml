[package]
name = "lemon"
version = "1.0.0"
rust-version = "1.88"
readme = "README.md"
documentation = "https://docs.rs/lemon"
include = ["src/**", "examples/**", "tests/**", "docs/guide.md", "docs/assets/**", "licenses/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]
edition = "2021"
license = "MIT"
repository = "https://github.com/lucasaarch/lemon"
description = "A reactive native desktop UI toolkit for Rust"
keywords = ["ui", "gui", "toolkit", "reactive"]
categories = ["gui"]

[dependencies]
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
parley = "0.9"
pollster = "0.4"
taffy = "0.7"
vello = "0.9"
wgpu = "29"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["NSGeometry"] }
